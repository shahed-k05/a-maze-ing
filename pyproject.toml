[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "mazegen"
version = "1.0.0"
description = "Maze generation reuseable module"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]

[tool.setuptools.packages.find]
include = ["mazegen*"]
